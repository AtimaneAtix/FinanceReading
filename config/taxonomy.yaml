# Tag taxonomy for the reading panel.
#
# Tags are "facet:value". Filters OR within a facet and AND across facets, so
# `asset:credit + asset:equities + scope:macro` means
# "(credit OR equities) AND macro".
#
# Two things assign tags, in this order:
#   1. native_map — the publisher's own category, mapped straight through.
#      This is the highest-quality signal available; prefer it over keywords.
#   2. rules      — case-insensitive regex over the title and summary.
#
# After editing this file run `npm run retag` to re-apply it to everything
# already stored. Editing is cheap and reversible; that is the point.

facets:
  - id: type
    label: Type
    values: [news, insight, outlook, forecast, commentary, research, podcast]

  - id: scope
    label: Scope
    values: [macro, micro]

  - id: asset
    label: Asset class
    values:
      [equities, fixed-income, credit, rates, fx, commodities, real-estate,
       crypto, multi-asset, private-markets]

  - id: region
    label: Region
    # `turkey`, `canada` and `switzerland` are named rather than folded into
    # `em`/`global` because each has a central bank in the source list whose
    # decisions are the reason to read it.
    values:
      [us, europe, uk, japan, china, em, global, turkey, canada, switzerland]

  - id: theme
    label: Theme
    values:
      [monetary-policy, inflation, growth, recession, geopolitics, ai, energy,
       elections, banking, housing, labour, trade, esg, valuations]

# Publisher category -> our tags. `npm run retag` prints the categories the
# configured sources emit that nothing maps yet; this list is that output,
# worked through.
#
# Keys match case-insensitively, so one entry covers both "Commodities" and
# "commodities". Every value must be a tag declared in `facets` above -- the
# worker refuses to start on one that is not, so a typo here fails loudly
# rather than silently dropping a tag.
#
# Left unmapped on purpose:
#   - Site furniture -- "Story", "Article", "Featured", "Latest", "Video" --
#     which says where a piece sits in the CMS, not what it is about.
#   - Labels that apply to nearly everything the source publishes, and so
#     separate nothing: "Investing" and "Markets" on a market-insights hub,
#     "Wealth Management" on a wealth manager.
#   - Bank of America's opaque ids ("SPID377", "wfid24662252", "GCS0080") and
#     its per-article keyword soup ("us population migration trends"), minted
#     fresh for each article. That stream never converges on a vocabulary, so
#     it is left to the keyword rules.
#   - The retirement and wealth-planning stream JPMAM publishes heavily
#     ("Defined Contribution", "College Savings", "Target Date Investing").
#   - Audience segments rather than subjects: "Financial Professional",
#     "Individual Investor", "Institutional", "PFS", "EDJONES". The fund
#     houses added in section 4 of sources.yaml tag by who a piece is sold to,
#     which says nothing about what it argues.
#     It is real content with no facet to land in; it wants a `audience:` or
#     `planning:` facet rather than a forced fit into asset class.
native_map:
  # --- format and series --------------------------------------------------
  # A named series is a better type signal than any keyword: "Exchanges" is
  # the Goldman Sachs podcast, whatever a given episode is about.
  "Podcast": [type:podcast]
  "Exchanges": [type:podcast]
  "Talks at GS": [type:podcast]
  "Research": [type:research]
  "Goldman Sachs Research": [type:research]
  "FEDS Notes": [type:research, scope:macro]
  "Multi-Asset Solutions Research Report": [type:research, asset:multi-asset]
  "Outlooks": [type:outlook]
  "Economic outlook": [type:outlook, scope:macro]
  "Global economic outlook": [type:outlook, scope:macro, region:global]
  "Global investment outlook": [type:outlook, region:global]
  "Economics Forecasting": [type:forecast, scope:macro]
  "Insights": [type:insight]
  "Institute insights": [type:insight]
  "Thought leadership": [type:insight]
  "Market Insights": [type:insight]
  "Portfolio Insights": [type:insight]
  "Asset Class Views": [type:insight]
  "Top of Mind": [type:insight]
  "Investment Banking Insights": [type:insight]
  "Notes on the Week Ahead": [type:commentary]
  "On the Minds of Investors": [type:commentary]
  "Eye on the Market": [type:commentary]
  "Economic Update": [type:commentary, scope:macro]
  "The Markets": [type:commentary]
  "Market Trends": [type:commentary]
  "Bond Bulletin": [type:commentary, asset:fixed-income]
  "Fixed Income Insights": [type:insight, asset:fixed-income]
  "ETF Insights": [type:insight]

  # --- central banks and policy -------------------------------------------
  # The Fed's own release categories, which is why these are news rather than
  # commentary: they announce an action, they do not argue a view.
  "Enforcement Actions": [type:news, scope:micro, theme:banking]
  "Orders on Banking Applications": [type:news, scope:micro, theme:banking]
  "Banking and Consumer Regulatory Policy": [type:news, theme:banking]
  "Policy Statements": [type:news]
  "Monetary Policy": [scope:macro, theme:monetary-policy]
  "Central Bank": [scope:macro, theme:monetary-policy]
  "Federal Reserve": [scope:macro, theme:monetary-policy, region:us]
  # Emitted by the Fed's own press feed once the FOMC entries started arriving.
  "Federal Open Market Committee (FOMC)": [scope:macro, theme:monetary-policy, region:us]
  "Interest Rates": [scope:macro, theme:monetary-policy, asset:rates]
  "Fiscal Policy": [scope:macro, theme:monetary-policy]
  "Fiscal Stimulus": [scope:macro, theme:monetary-policy]
  "Public Policy": [scope:macro]
  "Policy": [scope:macro]
  "Legislative and Regulatory": [scope:macro]
  "Legislative and Regulatory Program": [scope:macro]

  # --- macro --------------------------------------------------------------
  "Economics": [scope:macro]
  "Economy": [scope:macro]
  "Macroeconomics": [scope:macro]
  "Macroeconomic": [scope:macro]
  "US economy": [scope:macro, region:us]
  "Global economy": [scope:macro, region:global]
  "GDP": [scope:macro, theme:growth]
  "Growth": [scope:macro, theme:growth]
  "Inflation": [scope:macro, theme:inflation]
  "High inflation": [scope:macro, theme:inflation]
  "Food inflation": [scope:macro, theme:inflation]
  "Consumer prices": [scope:macro, theme:inflation]
  "Food prices": [scope:macro, theme:inflation]
  "Recession": [scope:macro, theme:recession]
  "Employment": [scope:macro, theme:labour]
  "Productivity": [scope:macro, theme:labour]
  "Housing": [scope:macro, theme:housing]
  "Consumer Spending": [scope:macro]
  "Business Investment": [scope:macro]
  "Trade": [scope:macro, theme:trade]
  "Tariffs": [scope:macro, theme:trade]
  "Liquidity": [scope:macro]
  "Market Volatility": [scope:macro]
  "Volatility": [scope:macro]
  # A market-direction call is a statement about what things are worth.
  "Bull Market": [theme:valuations]
  "Bear Market": [theme:valuations]

  # --- asset classes ------------------------------------------------------
  "Equities": [asset:equities]
  "Factor investing": [asset:equities]
  "Fixed Income": [asset:fixed-income]
  "Fixed income investing": [asset:fixed-income]
  "Bonds": [asset:fixed-income]
  "Income": [asset:fixed-income]
  "Government Bonds": [asset:fixed-income, asset:rates]
  "US Treasuries": [asset:fixed-income, asset:rates, region:us]
  "Rates": [asset:rates]
  "Credit": [asset:credit]
  "Corporate Credit": [asset:credit]
  "Investment Grade": [asset:credit, asset:fixed-income]
  "Private credit": [asset:credit, asset:private-markets]
  "Asset Based Finance": [asset:credit, asset:private-markets]
  "Commodities": [asset:commodities]
  "Oil": [asset:commodities, theme:energy]
  "Real estate": [asset:real-estate]
  "Real Asset": [asset:real-estate, asset:commodities]
  "Private equity": [asset:private-markets]
  "Alternatives": [asset:private-markets]
  "Alternatives & Private Markets": [asset:private-markets]
  "Hedge funds": [asset:private-markets]
  "Venture Capital": [asset:private-markets, scope:micro]
  "Multi-Asset Solutions": [asset:multi-asset]
  "Asset Allocation": [asset:multi-asset]
  "Crypto": [asset:crypto]
  "Cryptocurrency": [asset:crypto]
  "Bitcoin": [asset:crypto]
  "Pension/LDI": [asset:fixed-income]

  # --- regions ------------------------------------------------------------
  "United States": [region:us]
  "US": [region:us]
  "Europe": [region:europe]
  "Japan": [region:japan]
  "China": [region:china]
  "India": [region:em]
  "India economy": [region:em, scope:macro]
  "Global": [region:global]

  # --- themes -------------------------------------------------------------
  "Artificial Intelligence": [theme:ai]
  "Artificial Intelligence (AI)": [theme:ai]
  "AI-enabled autonomy": [theme:ai]
  "Energy": [theme:energy]
  "Mass energy storage": [theme:energy]
  "Geopolitics": [theme:geopolitics]
  "National Security": [theme:geopolitics]
  "Sovereign defense capability": [theme:geopolitics]
  "Defense modernization": [theme:geopolitics]
  "Elections": [scope:macro, theme:elections]
  "U.S. Elections": [scope:macro, theme:elections, region:us]
  "ESG": [theme:esg]
  "Sustainability": [theme:esg]
  "Sustainable investing": [theme:esg]
  "Sustainability trends": [theme:esg]
  "Sustainability insights": [theme:esg]
  "Environment": [theme:esg]

  # --- company and sector level -------------------------------------------
  # Single-company and single-sector work: the micro half of the scope facet,
  # which keyword rules rarely catch because the text names the company
  # rather than saying "micro".
  "Earnings": [scope:micro]
  "Mergers and Acquisitions": [scope:micro]
  "Initial Public Offerings": [scope:micro]
  "Technology": [scope:micro]
  "Software": [scope:micro]
  "Cybersecurity Software": [scope:micro]
  "Aerospace and Defense": [scope:micro, theme:geopolitics]
  "Defense Technology": [scope:micro, theme:geopolitics]
  "Space Economy": [scope:micro]
  "Satellite communications": [scope:micro]
  "Consumer": [scope:micro]
  "Food and Beverage": [scope:micro]
  "Transportation": [scope:micro]
  "Infrastructure": [scope:micro]
  "Health and Wellness": [scope:micro]
  "Obesity drugs": [scope:micro]
  "Anti-obesity drugs": [scope:micro]
  "Weight loss drugs": [scope:micro]
  "Founders": [scope:micro]

rules:
  # --- type ---------------------------------------------------------------
  - tag: type:outlook
    any: ['\boutlook\b', 'year ahead', '\bmid[- ]?year\b', '\bQ[1-4] 20\d\d\b', 'what to expect']
  - tag: type:forecast
    any: ['\bforecast', 'projection', 'we expect', 'base case', 'scenario']
  - tag: type:commentary
    any: ['\bcommentary\b', 'market update', 'weekly review', 'this week in', 'quick take']
  - tag: type:research
    any: ['\bresearch\b', 'white ?paper', 'working paper', 'study finds', 'methodology']
  - tag: type:podcast
    any: ['\bpodcast\b', '\bepisode\b', '\blisten\b']
  - tag: type:insight
    any: ['\binsight', 'perspective', 'viewpoint', 'point of view', '\bthought']

  # --- scope --------------------------------------------------------------
  - tag: scope:macro
    any:
      ['\bgdp\b', 'inflation', 'central bank', '\bfomc\b', '\becb\b', '\bfed\b',
       'interest rate', 'monetary polic', 'fiscal', 'unemployment', 'labou?r market',
       'recession', 'macro', 'economic outlook', 'yield curve', 'sovereign']
  - tag: scope:micro
    any:
      ['\bearnings\b', 'balance sheet', 'free cash flow', 'profit margin',
       '\bipo\b', 'merger', 'acquisition', 'company', 'issuer', 'stock pick',
       'single[- ]name', 'downgrade', 'upgrade']

  # --- asset class --------------------------------------------------------
  - tag: asset:fixed-income
    any:
      ['\bbond', 'fixed income', '\bdebt\b', '\bduration\b', 'treasur', '\bgilt',
       '\bbund', '\bjgb\b', 'yield curve', 'coupon', 'maturit', 'sovereign']
  - tag: asset:credit
    any:
      ['\bcredit\b', 'high yield', 'investment grade', '\bspread', 'default rate',
       '\bloan', 'securitiz', 'securitis', '\bcds\b', 'leveraged finance']
  - tag: asset:rates
    any: ['\brates\b', 'rate cut', 'rate hike', 'policy rate', 'term premium', 'duration risk']
  - tag: asset:equities
    any: ['\bequit', '\bstock', '\bshares\b', '\bs&p\b', 'nasdaq', 'earnings season', 'small[- ]cap']
  - tag: asset:fx
    any: ['\bcurrenc', 'foreign exchange', '\bfx\b', '\bdollar\b', '\beuro\b', '\byen\b', 'renminbi']
  - tag: asset:commodities
    any: ['commodit', '\boil\b', 'crude', 'natural gas', '\bgold\b', '\bcopper\b', 'metals']
  - tag: asset:real-estate
    any: ['real estate', '\breit', 'property market', 'commercial property', 'housing market']
  - tag: asset:crypto
    any: ['crypto', 'bitcoin', 'ethereum', 'digital asset', 'stablecoin', 'tokeni[sz]']
  - tag: asset:multi-asset
    any: ['multi[- ]asset', 'asset allocation', 'balanced portfolio', '60/40', 'diversification']
  - tag: asset:private-markets
    any: ['private market', 'private equity', 'private credit', 'venture capital', 'infrastructure fund']

  # --- region -------------------------------------------------------------
  - tag: region:us
    any: ['\bu\.?s\.?\b', 'united states', 'america', '\bfed\b', '\bfomc\b', 'treasur']
  - tag: region:europe
    any: ['\beurope', 'euro ?zone', 'euro area', '\becb\b', '\bgermany\b', '\bfrance\b', '\bitaly\b']
  - tag: region:uk
    any: ['\buk\b', 'united kingdom', 'britain', 'bank of england', '\bgilt', 'sterling']
  - tag: region:japan
    any: ['\bjapan', '\bboj\b', '\byen\b', '\bjgb\b']
  - tag: region:china
    any: ['\bchina\b', 'chinese', '\bpboc\b', 'renminbi', 'hong kong']
  - tag: region:em
    any: ['emerging market', '\bem\b debt', 'frontier market', '\bindia\b', '\bbrazil\b', '\bmexico\b']
  - tag: region:global
    any: ['\bglobal\b', 'worldwide', 'cross[- ]border', 'international']

  # --- theme --------------------------------------------------------------
  - tag: theme:monetary-policy
    any: ['monetary polic', 'rate cut', 'rate hike', 'quantitative (easing|tightening)', '\bfomc\b', 'central bank']
  - tag: theme:inflation
    any: ['inflation', '\bcpi\b', '\bpce\b', 'price pressure', 'disinflation', 'deflation']
  - tag: theme:growth
    any: ['\bgrowth\b', '\bgdp\b', 'expansion', 'soft landing']
  - tag: theme:recession
    any: ['recession', 'hard landing', 'downturn', 'contraction']
  - tag: theme:geopolitics
    any: ['geopolit', '\bwar\b', 'conflict', 'sanction', 'tariff', 'trade tension']
  - tag: theme:ai
    any: ['\bai\b', 'artificial intelligence', 'machine learning', 'data cent', 'semiconductor']
  - tag: theme:energy
    any: ['\benergy\b', '\boil\b', 'natural gas', 'renewable', 'transition', 'power demand']
  - tag: theme:elections
    any: ['election', '\bvote\b', 'ballot', 'referendum', 'fiscal polic']
  - tag: theme:banking
    any: ['\bbank', 'lending standard', 'deposit', 'basel', 'capital requirement']
  - tag: theme:housing
    any: ['housing', 'mortgage', 'home price', 'residential']
  - tag: theme:labour
    any: ['labou?r market', 'employment', 'unemploy', 'payroll', 'wage', 'jobs report']
  - tag: theme:trade
    any: ['\btrade\b', 'tariff', 'export', 'import', 'supply chain']
  - tag: theme:esg
    any: ['\besg\b', 'sustainab', 'climate', 'net zero', 'decarbon']
  - tag: theme:valuations
    any: ['valuation', 'price[/ ]earnings', '\bp/e\b', 'expensive', 'overvalued', 'cheap']
