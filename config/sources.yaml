# Source registry. This file is the heart of the project — adding an
# institution is a block here, never a code change.
#
# Every URL below was fetched and parsed with this project's own user-agent --
# on 2026-09-11, or on 2026-09-20 for the sources added that day -- except
# where a comment says otherwise. That matters: several of these hosts answer
# 406/403 to a *browser* user-agent and 200 to ours, so a URL that looks dead
# in your browser may be perfectly alive to the worker.
#
#   npm run doctor                  # tests every source, prints what works
#   npm run discover -- <page-url>  # hunts the real endpoint behind a JS page
#
# Adapters, best first: json > rss > sitemap > html > browser.
# See README.md for the field reference.

defaults:
  poll_minutes: 30
  # How many articles each source may contribute per run. The panel is a
  # reading list, not an archive: a few per source keeps every institution
  # visible instead of letting whichever one publishes most bury the rest,
  # and a first run fills with what is current rather than with a decade of
  # back catalogue. What does not fit waits for the next run.
  #
  # A sitemap adapter's own max_new_per_run is a *crawl* budget and must not
  # exceed this -- it records every URL it visits, so anything it fetched and
  # the run then dropped would never be offered again. The config check
  # refuses to start on that combination.
  take_per_run: 5

sources:
  # ===========================================================================
  # 1. CENTRAL BANKS AND OFFICIAL INSTITUTIONS
  # Conventional RSS, stable, made to be consumed.
  # ===========================================================================

  - id: fed-press
    institution: Federal Reserve
    name: Press releases
    homepage: https://www.federalreserve.gov
    static_tags: [type:news, scope:macro, region:us, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.federalreserve.gov/feeds/press_all.xml

  - id: fed-notes
    institution: Federal Reserve
    name: FEDS Notes
    homepage: https://www.federalreserve.gov
    static_tags: [type:research, scope:macro, region:us]
    adapter:
      kind: rss
      url: https://www.federalreserve.gov/feeds/feds_notes.xml

  - id: ecb-press
    institution: ECB
    name: Press releases
    homepage: https://www.ecb.europa.eu
    static_tags: [type:news, scope:macro, region:europe, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.ecb.europa.eu/rss/press.html

  - id: boe-news
    institution: Bank of England
    name: News and publications
    homepage: https://www.bankofengland.co.uk
    static_tags: [type:news, scope:macro, region:uk, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.bankofengland.co.uk/rss/news

  - id: bis-publications
    institution: BIS
    name: Publications
    homepage: https://www.bis.org
    static_tags: [type:research, scope:macro, region:global]
    adapter:
      # BIS publishes no feed, and its sitemap nests an index inside an index,
      # which the adapter does not follow. This is the first leaf page, which
      # holds the publications and media releases.
      kind: sitemap
      url: https://www.bis.org/default/sitemap.xml?page=1
      include: ['/publ/', '/publications/', '/media-releases/']
      exclude: ['/author/']
      max_new_per_run: 5

  # Disabled 2026-09-08. imf.org sits behind Akamai, which returns 403 to every
  # plain HTTP request regardless of user agent -- the feed URL is not the
  # problem, so no URL change revives this. Reaching it needs the browser
  # adapter or a hunted endpoint:
  #   npm run discover -- https://www.imf.org/en/Blogs
  - id: imf-blog
    enabled: false
    institution: IMF
    name: Blog
    homepage: https://www.imf.org
    static_tags: [type:insight, scope:macro, region:global]
    adapter:
      kind: rss
      url: https://www.imf.org/en/Blogs/rss

  - id: boj-news
    institution: Bank of Japan
    name: What's new
    homepage: https://www.boj.or.jp
    static_tags: [type:news, scope:macro, region:japan, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.boj.or.jp/en/rss/whatsnew.xml

  - id: snb-news
    institution: Swiss National Bank
    name: News
    homepage: https://www.snb.ch
    static_tags: [type:news, scope:macro, region:switzerland, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.snb.ch/public/en/rss/news

  - id: boc-press
    institution: Bank of Canada
    name: Press releases
    homepage: https://www.bankofcanada.ca
    static_tags: [type:news, scope:macro, region:canada, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.bankofcanada.ca/content_type/press-releases/feed/

  # The CBRT serves Atom under a Content-Type of text/html. The rss adapter
  # sniffs the body rather than trusting the header, so it parses fine -- but
  # do not be alarmed if the URL renders as a wall of XML in a browser.
  #
  # Its dates arrive as "Sep 10, 2026, 2:00:00 PM" rather than ISO; rss-parser
  # normalises them correctly, verified against the 10 Sep 2026 rate decision.
  #
  # Two further feeds exist on the same stem and are one line to enable:
  #   .../RSS/Remarks+by+Governor   -- speeches, live (newest Aug 2026)
  #   .../RSS/MPC+Decisions         -- stale since Dec 2025; the rate decisions
  #                                    come through Press Releases instead, so
  #                                    it is left out rather than duplicated.
  - id: cbrt-press
    institution: CBRT
    name: Press releases
    homepage: https://www.tcmb.gov.tr
    static_tags: [type:news, scope:macro, region:turkey, theme:monetary-policy]
    adapter:
      kind: rss
      url: https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB+EN/Bottom+Menu/Other/RSS/Press+Releases

  - id: cbrt-publications
    institution: CBRT
    name: Publications
    homepage: https://www.tcmb.gov.tr
    static_tags: [type:research, scope:macro, region:turkey]
    adapter:
      kind: rss
      url: https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB+EN/Bottom+Menu/Other/RSS/Publications

  # ===========================================================================
  # 2. REGIONAL FED RESEARCH
  # The Federal Reserve's district banks publish the best free macro writing
  # there is, on ordinary WordPress feeds.
  # ===========================================================================

  - id: nyfed-liberty-street
    institution: New York Fed
    name: Liberty Street Economics
    homepage: https://libertystreeteconomics.newyorkfed.org
    static_tags: [type:research, scope:macro, region:us]
    adapter:
      kind: rss
      url: https://libertystreeteconomics.newyorkfed.org/feed/

  - id: fred-blog
    institution: St. Louis Fed
    name: FRED Blog
    homepage: https://fredblog.stlouisfed.org
    static_tags: [type:commentary, scope:macro, region:us]
    adapter:
      kind: rss
      url: https://fredblog.stlouisfed.org/feed/

  # ===========================================================================
  # 3. REGULATORS AND ACADEMIC RESEARCH
  # ===========================================================================

  - id: sec-press
    institution: SEC
    name: Press releases
    homepage: https://www.sec.gov
    static_tags: [type:news, region:us]
    adapter:
      kind: rss
      url: https://www.sec.gov/news/pressreleases.rss

  - id: nber-working-papers
    institution: NBER
    name: New working papers
    homepage: https://www.nber.org
    static_tags: [type:research, region:us]
    adapter:
      # Note the `back.` host -- www.nber.org/rss/new.xml does not serve this.
      kind: rss
      url: https://back.nber.org/rss/new.xml

  - id: bruegel-publications
    institution: Bruegel
    name: Publications
    homepage: https://www.bruegel.org
    static_tags: [type:research, scope:macro, region:europe]
    adapter:
      kind: rss
      url: https://www.bruegel.org/rss.xml

  # ===========================================================================
  # 4. ASSET MANAGERS AND FUND HOUSES — insights and market outlooks
  # ===========================================================================
  #
  # These insight hubs are JavaScript search applications (PIMCO's is Coveo —
  # the `@publishz32xdate` field name and the `f:category=[guid,...]` fragment
  # give it away). A plain HTTP fetch of the listing page returns an empty
  # shell, so the sitemap adapter below is the honest no-JavaScript fallback:
  # it finds new article URLs and reads the title and date from each article's
  # own OpenGraph/JSON-LD metadata.
  #
  # It works, but it is second best. Run `npm run discover` against each
  # listing page to capture the real JSON endpoint, then replace the block
  # with a `kind: json` adapter — richer data, native categories, no per-article
  # fetches.
  #
  # Each of these sitemaps carries a <lastmod> on every URL, which is what
  # keeps the section usable: most of these article pages publish no
  # OpenGraph or JSON-LD date of their own, so lastmod is the ordering. The
  # adapter marks such dates estimated and ranks them below publisher-dated
  # items, which is the correct outcome, not a defect.
  # ---------------------------------------------------------------------------

  - id: pimco-insights
    institution: PIMCO
    name: Insights
    homepage: https://www.pimco.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      url: https://www.pimco.com/sitemap.xml
      include: ['/insights/', '/blog/']
      exclude: ['/funds/', '/literature/']
      max_new_per_run: 5

  # The one source here that publishes its own content API. Found by running
  # `npm run discover` against https://www.goldmansachs.com/insights and
  # reading the network capture: the page fetches this feed itself, no token
  # and no pagination, and it is the whole insights corpus -- 2100 articles
  # with real publication dates and the CMS taxonomy attached. Everything the
  # sitemap adapter has to infer is stated here outright, which is why a json
  # adapter is always worth the hunt.
  - id: goldman-insights
    institution: Goldman Sachs
    name: Insights
    homepage: https://www.goldmansachs.com
    static_tags: [type:insight]
    adapter:
      kind: json
      request:
        method: GET
        url: https://www.goldmansachs.com/feeds/insights.json
      items_path: ''            # the records are the top-level array
      fields:
        title: title
        url: slug               # relative; resolved against `homepage`
        summary: description
        published_at: cmsPageProps.publishDate
        # The taxonomy is split four ways, and each part earns its keep:
        # pageType separates podcasts and videos from articles, series names
        # "Exchanges" and "Top of Mind", and the topics carry the subject.
        categories:
          - cmsPageProps.pageType
          - cmsPageProps.contentType[].title
          - cmsPageProps.series[].title
          - cmsPageProps.primaryTopic[].title
          - cmsPageProps.secondaryTopic[].title
      # Newest 5 of the 2100. The handful of section landing pages mixed in
      # carry no publishDate, so they sort last and never reach the cut.
      max_new_per_run: 5
    fallback:
      # If the feed moves, fall back to what this source used before it.
      - kind: sitemap
        url: https://www.goldmansachs.com/sitemap.xml
        include: ['/insights/']
        max_new_per_run: 5

  - id: morganstanley-ideas
    institution: Morgan Stanley
    name: Ideas
    homepage: https://www.morganstanley.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      url: https://www.morganstanley.com/sitemap.xml
      include: ['/ideas/', '/insights/']
      max_new_per_run: 5

  # Disabled 2026-09-20. Morgan Stanley Investment Management sits on its own
  # Akamai property and answers 403 to every plain request -- /im/sitemap.xml,
  # /im/sitemap2.xml, /im/robots.txt and the insights page itself, to a browser
  # user-agent as readily as to ours -- the same hard block as imf-blog, so
  # there is no URL to fix. The parent sitemapindex.xml advertises both /im/
  # children, which is how you find them and not how you read them.
  #
  # morganstanley-ideas above is not a substitute: the corporate sitemap it
  # reads carries 832 /insights/ URLs and not one under /im/. Reviving this
  # needs the browser adapter:
  #   npm run discover -- https://www.morganstanley.com/im/en-gb/intermediary-investor/insights.html
  - id: msim-insights
    enabled: false
    institution: Morgan Stanley Investment Management
    name: Insights
    homepage: https://www.morganstanley.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      url: https://www.morganstanley.com/im/sitemap.xml
      include: ['/insights/']
      max_new_per_run: 5

  - id: schroders-insights
    institution: Schroders
    name: Insights
    homepage: https://www.schroders.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      url: https://www.schroders.com/sitemap.xml
      include: ['/insights/']
      max_new_per_run: 5

  - id: blackrock-bii
    institution: BlackRock
    name: Investment Institute
    homepage: https://www.blackrock.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      url: https://www.blackrock.com/corporate/sitemap.xml
      include: ['/insights/blackrock-investment-institute/', '/insights/thought-leadership/']
      # The section's own furniture: landing pages, media libraries and the
      # corporate-policy tree, all of which match the include patterns but are
      # not articles.
      exclude:
        - '/(events|videos|insights|outlook|publications|global-insights)$'
        - '/(investment-stewardship|meet-the-bii-team)$'
        - '/thought-leadership/public-policy/'
      max_new_per_run: 5

  - id: blackrock-us-individual
    institution: BlackRock
    name: US individual insights
    homepage: https://www.blackrock.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # A separate property from the corporate tree above, with its own entry
      # in robots.txt. 122 URLs under /insights/, of which 84 are flat
      # `/insights/<slug>` market commentary -- "Macro implications of
      # chipflation", "Stock opportunities as rates fall" -- that the corporate
      # sitemap does not carry at all.
      #
      # Know this before judging its dates: these pages publish no OpenGraph or
      # JSON-LD date whatsoever, and every URL in the file shares one lastmod
      # restamped on each CMS rebuild. So everything from here arrives
      # date-estimated and in no meaningful order among itself. That is not new
      # -- the corporate pages blackrock-bii reads are undated the same way --
      # but one shared lastmod removes even the ordering, so
      # max_undated_per_run keeps it to a trickle rather than a daily handful.
      url: https://www.blackrock.com/us/individual/sitemap.xml
      include: ['/us/individual/insights/']
      exclude:
        - '/insights/video/'
        # Already covered: blackrock-bii reads the Investment Institute, and
        # the retirement pages are education rather than market writing.
        - '/insights/blackrock-investment-institute'
        - '/insights/retirement(/|$)'
        # Two section hubs that sit at article depth.
        - '/insights/(active-investor-series|thematic-investing)$'
      max_new_per_run: 5
      max_undated_per_run: 2

  - id: jpmam-insights
    institution: J.P. Morgan Asset Management
    name: Insights
    homepage: https://am.jpmorgan.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # The root sitemap.xml is an empty stub. robots.txt points at a real
      # index, but its 90 children are one per region+language and carry no
      # lastmod, so the adapter cannot tell which are freshest. Naming the US
      # institutional child directly avoids importing the Hong Kong Chinese site.
      url: https://am.jpmorgan.com/us/en/asset-management/institutional/sitemap.xml
      include: ['/insights/']
      max_new_per_run: 5

  - id: jpmorgan-insights
    institution: J.P. Morgan
    name: Markets and Global Research
    homepage: https://www.jpmorgan.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # The bank's own insights, which is a different publication from
      # jpmam-insights above -- that one is am.jpmorgan.com, the asset manager.
      # Same shape of problem and the same answer: www.jpmorgan.com/sitemap.xml
      # is an index of ~90 region+language children carrying no lastmod, so the
      # US one is named directly rather than left to the adapter to guess.
      #
      # /insights/ holds some 1400 URLs across 22 topics, most of them treasury,
      # payments and commercial banking. The two included here are the market
      # ones. markets-and-economy is also where the Wealth Partners insights
      # hub sends its Top Market Takeaways -- that hub is a JavaScript page
      # with three URLs of its own in the sitemap, so this is the way in.
      #
      # The two-segment include is deliberate: each topic publishes a dozen or
      # so section hubs one segment down (.../global-research/commodities),
      # which no exclusion list stays ahead of. It costs the two articles that
      # are published at hub depth by mistake.
      #
      # Most of these pages carry `<meta name="publishDate">`, which the
      # generic date matcher picks up, so the dates are usually the
      # publisher's own -- four of the first five fetched were. The ones that
      # do not state a date offer only an `alg-search-date` epoch, which is not
      # read, and fall back to the sitemap's lastmod. Those lastmods are at
      # least genuinely per-URL and current, so max_undated_per_run is a brake
      # rather than the main event.
      url: https://www.jpmorgan.com/US/en/sitemap.xml
      include: ['/insights/(markets-and-economy|global-research)/[^/]+/[^/]+$']
      max_new_per_run: 5
      max_undated_per_run: 2

  - id: morningstar-markets
    institution: Morningstar
    name: Markets
    homepage: https://www.morningstar.com
    static_tags: [type:commentary]
    adapter:
      kind: sitemap
      # www.morningstar.com/sitemap.xml indexes stock, fund and ETF quote pages
      # -- 5000 URLs, no articles. Editorial lives in the Arc outbound feed,
      # whose children are dated newest-first.
      url: https://media.morningstar.com/arc/outboundfeeds/sitemap/morningstar-all/
      # /financial-advisors/ is the advisor-facing writing behind
      # morningstar.com/financial-advisors -- roughly one piece every other
      # day, and it was simply missing from this list rather than rejected.
      include:
        - '/markets/'
        - '/economy/'
        - '/funds/'
        - '/personal-finance/'
        - '/financial-advisors/'
      max_new_per_run: 5

  # Flaky, not broken. /sitemap.xml is an index with exactly one child,
  # .../bank-of-america-institute.sitemap.xml, and on 2026-09-10 that child
  # answered 400 for several hours before recovering on its own. robots.txt
  # advertises the same single URL and the site publishes no feed, so there is
  # no second way in: when it flaps, the source fails, backs off and comes
  # back. That is the health strip working, not a source to go and fix.
  # If it ever stays down:
  #   npm run discover -- https://institute.bankofamerica.com/economic-insights.html
  - id: bofa-institute
    institution: Bank of America
    name: BofA Institute
    homepage: https://institute.bankofamerica.com
    static_tags: [type:research]
    adapter:
      kind: sitemap
      url: https://institute.bankofamerica.com/sitemap.xml
      max_new_per_run: 5

  - id: vanguard-insights
    institution: Vanguard
    name: Insights
    homepage: https://advisors.vanguard.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # advisors.vanguard.com, not corporate.vanguard.com: the corporate
      # sitemap is 187 press releases and 7 insight pages, while this one is
      # 132 `/insights/article/` pieces -- the market-perspectives and
      # economic-outlook writing you actually want.
      url: https://advisors.vanguard.com/sitemaps/en.sitemap.xml
      include: ['/insights/article/']
      max_new_per_run: 5

  - id: invesco-insights
    institution: Invesco
    name: Insights
    homepage: https://www.invesco.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # Invesco's WAF is inverted: it answers 406 to a Chrome user-agent and
      # 200 to a plain bot one, so this works for the worker and appears dead
      # if you paste it into a browser. 306 flat `/us/en/insights/<slug>.html`
      # articles; `/insights/topic/` is the section furniture, not articles.
      url: https://www.invesco.com/us/en/sitemap.xml
      include: ['/us/en/insights/']
      exclude: ['/insights/topic/']
      max_new_per_run: 5

  - id: ishares-insights
    institution: iShares
    name: Insights
    homepage: https://www.ishares.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # Portfolio Insights and Inside the Market. Separate from blackrock-bii:
      # the Investment Institute is house macro research, this is the ETF
      # desk's market commentary, and they do not overlap.
      url: https://www.ishares.com/us/sitemap.xml
      include: ['/insights/']
      exclude: ['/investor-education/']
      max_new_per_run: 5

  - id: pictet-insights
    institution: Pictet
    name: Market insights
    homepage: https://pnaa.pictet.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # Pictet North America Advisors, advertised in robots.txt. 229 of this
      # file's 251 URLs are insights: a weekly house view published as
      # `Weekly-views-YYYYMMDD`, plus 24 longer `stories/` pieces. Every
      # article carries JSON-LD datePublished, so nothing here arrives
      # estimated -- one of the better-behaved sources in this section.
      url: https://pnaa.pictet.com/sitemap.xml
      include: ['/insights/']
      exclude:
        # The two index pages under the section root. The root itself has no
        # trailing slash, so the include pattern already passes it by.
        - '/insights/(stories|full-list-of-market-insights)$'
      max_new_per_run: 5

  - id: alliancebernstein-insights
    institution: AllianceBernstein
    name: Insights
    homepage: https://www.alliancebernstein.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # The root sitemap.xml is an index of 65 per-region children whose
      # lastmods all read 2023-06-29, so the adapter cannot tell which is
      # freshest -- naming the US child directly is what keeps this English and
      # current. Inside it are 1876 `/investments/insights/` URLs across eleven
      # subsections, dated per URL, and each article states its own
      # article:published_time.
      url: https://www.alliancebernstein.com/us/en-us/investments.sitemap.xml
      include: ['/investments/insights/']
      exclude:
        # The eleven subsection landing pages, which sit one segment under
        # /insights/ where the articles sit two.
        - '/insights/[^/]+\.html$'
        # Advisor business content -- client conversations, practice growth --
        # rather than market writing.
        - '/insights/practice-management/'
      max_new_per_run: 5

  - id: ssga-insights
    institution: State Street
    name: SSGA Insights
    homepage: https://www.ssga.com
    static_tags: [type:insight]
    adapter:
      kind: sitemap
      # SSGA publishes the same sitemap under institutional/, intermediary/
      # and individual/ audiences. Checked: no article tail appears under more
      # than one, so there is nothing to deduplicate -- but individual/ is
      # retail education rather than market work, so it is left out.
      url: https://www.ssga.com/us/en/sitemap.xml
      include: ['/institutional/insights/', '/intermediary/insights/']
      max_new_per_run: 5

  # ===========================================================================
  # 5. RATING AGENCIES
  #
  # Two of the big three are reachable and one is not. S&P Global answers 403
  # to every request including robots.txt -- the same hard Akamai block as
  # imf-blog, so there is no URL to fix and no entry below. If you want S&P it
  # needs the browser adapter.
  # ===========================================================================

  - id: fitch-research
    institution: Fitch Ratings
    name: Research and rating actions
    homepage: https://www.fitchratings.com
    static_tags: [type:research, asset:credit]
    adapter:
      kind: sitemap
      # The research leaf of the sitemap index: 500 URLs, every one with a
      # lastmod, refreshed daily. This is a firehose of individual rating
      # actions ("Fitch Upgrades City of Porto to A"), which is exactly what a
      # rating agency is for -- take_per_run keeps it from flooding the panel.
      #
      # Caveat worth knowing: fitchratings.com is a Gatsby app, so the server
      # HTML carries no OpenGraph title. Titles here are therefore derived
      # from the URL slug, which means sentence case and a trailing date
      # ("Celanese corp 10 09 2026"). Readable, but not the publisher's own
      # wording. Fixing it properly means the browser adapter.
      url: https://www.fitchratings.com/sitemap-research.xml
      include: ['/research/']
      exclude: [':slug']        # one route template is published in the sitemap
      max_new_per_run: 5

  - id: moodys-insights
    institution: Moody's
    name: Insights
    homepage: https://www.moodys.com
    static_tags: [type:insight, asset:credit]
    adapter:
      kind: sitemap
      # Found with `npm run discover -- https://www.moodys.com/web/en/us/insights.html`.
      # Do not use www.moodys.com/sitemap.xml: it is 22,000 URLs of credit-rating
      # entity pages and legacy .aspx, with no insights in it. This one is 2761
      # URLs, all dated. The exclusions drop Moody's non-credit lines -- RMS
      # catastrophe/insurance modelling and the KYC product -- which are half
      # the file and nothing to do with markets.
      url: https://www.moodys.com/web/sitemap.xml
      include: ['/insights/']
      exclude:
        - '/insights/insurance/'
        - '/kyc/'
        # The 18 section landing pages -- /insights/tariffs.html,
        # /insights/data-visualizations.html and the rest -- all sit one
        # segment under /insights/, which articles never do.
        - '/insights/[^/]+\.html$'
        # Two topic hubs that sit at article depth under credit-risk/ rather
        # than at the section root, so the rule above does not catch them.
        # They carry a fresh lastmod on every CMS rebuild and would otherwise
        # keep resurfacing at the top of the list.
        - '/insights/credit-risk/(emerging-markets|sustainable-finance-and-credit)\.html$'
      max_new_per_run: 5

  # ===========================================================================
  # 6. EUROPEAN BANK RESEARCH
  #
  # Thin on purpose, because most of it is unreachable rather than unwanted.
  # Checked and rejected on 2026-09-11: Rabobank, Allianz Research and
  # Allianz Trade (403), Deutsche Bank Research (410 -- retired), Nordea,
  # Danske, Commerzbank and Santander (404, no feed), UniCredit and Scope
  # Ratings (single-page apps whose sitemaps list route templates, not URLs).
  # Each would need the browser adapter or a discover run.
  # ===========================================================================

  - id: ing-think
    institution: ING
    name: THINK
    homepage: https://think.ing.com
    static_tags: [type:insight, scope:macro, region:europe]
    adapter:
      # A real RSS feed with full summaries -- the best-formed source in this
      # section by some margin, and the only European bank here that publishes
      # one at all.
      kind: rss
      url: https://think.ing.com/rss

  # Disabled 2026-09-11, and the reason is worth reading before you enable it.
  # BBVA Research is WordPress but its /feed/ 404s, so the only way in is the
  # sitemap -- and that sitemap was last generated 2026-06-05, three months
  # stale, so it would import nothing current. It is also split across 21
  # rolling `publicacion-sitemapN.xml` children, all sharing one lastmod, so
  # the adapter cannot pick the newest and the number below goes stale as the
  # archive grows. Most of the content is Spanish. Revive with:
  #   npm run discover -- https://www.bbvaresearch.com/en/
  - id: bbva-research
    enabled: false
    institution: BBVA
    name: BBVA Research
    homepage: https://www.bbvaresearch.com
    static_tags: [type:research, scope:macro]
    adapter:
      kind: sitemap
      url: https://www.bbvaresearch.com/publicacion-sitemap21.xml
      include: ['/publicaciones/']
      max_new_per_run: 5

  # ===========================================================================
  # 7. INDEPENDENT COMMENTARY
  # Not an institution's house view -- which is the entire point of having it.
  # ===========================================================================

  - id: econbrowser
    institution: Econbrowser
    name: Econbrowser
    homepage: https://econbrowser.com
    static_tags: [type:commentary, scope:macro]
    adapter:
      kind: rss
      url: https://econbrowser.com/feed

  - id: klement-on-investing
    institution: Klement on Investing
    name: Klement on Investing
    homepage: https://klementoninvesting.substack.com
    static_tags: [type:commentary]
    adapter:
      kind: rss
      url: https://klementoninvesting.substack.com/feed

  - id: damodaran-musings
    institution: Aswath Damodaran
    name: Musings on Markets
    homepage: https://aswathdamodaran.blogspot.com
    static_tags: [type:commentary]
    adapter:
      # Blogger serves Atom at this stem; the rss adapter sniffs the body, so
      # it parses like any other feed.
      kind: rss
      url: https://aswathdamodaran.blogspot.com/feeds/posts/default

  # ===========================================================================
  # 8. CONSULTANCIES
  # ===========================================================================

  - id: mckinsey-insights
    institution: McKinsey
    name: Insights and publications
    homepage: https://www.mckinsey.com
    static_tags: [type:research]
    adapter:
      # mckinsey.com is hostile to plain crawling in an unusual way: robots.txt,
      # sitemap.xml and every /capabilities/... listing page accept the
      # connection and then reset it, under any user-agent and over HTTP/1.1 as
      # well as HTTP/2 -- so they do not 403, they simply never answer. This
      # feed does, with 50 items and real pubDates. A robots.txt we cannot
      # fetch is treated as permissive, which is what makes it reachable.
      #
      # It is the firm-wide stream. There is no per-capability feed -- every
      # shape under /capabilities/strategy-and-corporate-finance/our-insights
      # returns 404 -- so the taxonomy is what separates the strategy and
      # corporate-finance writing from the healthcare and marketing pieces.
      kind: rss
      url: https://www.mckinsey.com/insights/rss
